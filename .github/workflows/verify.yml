# Generated by Nodra's export script (the private monorepo is the source of truth).
# Every push and pull request: install from the frozen lockfile, typecheck, test and build.
# Every release: also require the built main.js to equal the release's main.js asset, byte for byte.
name: verify

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: The built main.js equals the release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern main.js --dir "$RUNNER_TEMP/release"
          built=$(sha256sum main.js | cut -d' ' -f1)
          published=$(sha256sum "$RUNNER_TEMP/release/main.js" | cut -d' ' -f1)
          echo "built     $built"
          echo "published $published"
          test "$built" = "$published"
